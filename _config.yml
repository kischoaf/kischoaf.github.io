title: "Kieran Schoaf"
tagline: "Network Engineer"
email: kischoaf@gmail.com
description: >-
  Network engineer specializing in Cisco infrastructure and Python automation.
  Led 75+ switch migrations across healthcare environments with zero unplanned downtime.
  CCNA and Network+ certified.
baseurl: ""
url: "https://kieranschoaf.com"
linkedin_username: "kieranschoaf"

author:
  name: "Kieran Schoaf"
  email: kischoaf@gmail.com

social:
  name: "Kieran Schoaf"
  links:
    - https://linkedin.com/in/kieranschoaf

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social-card.jpg
        width: 1200
        height: 630

# Repo-only files that should never be published
exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

# Hero copy
headline: >-
  I lead Cisco switch migrations for a multi-hospital healthcare system and build
  the Python tooling that makes them faster and safer.

bio: >-
  CCNA and Network+ certified, with a BS in Network Engineering from DePaul.
  Outside of work, my homelab is where I try new protocols and automation
  before they go anywhere near production.

currently: "Currently studying for CCNP Service Provider and building a BGP lab in EVE-NG"

# Section links are root-relative so they also work from project and post pages
nav_links:
  - title: Experience
    url: "/#experience"
  - title: Projects
    url: "/#projects"
  - title: Credentials
    url: "/#credentials"
  - title: Lab
    url: "/#lab"
  - title: Notes
    url: "/notes/"

sass:
  sass_dir: _sass

icon: /assets/img/favicon.ico
