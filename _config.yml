# Repo-only files that should never be published
exclude:
  - README.md
  - CLAUDE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

currently: "Currently studying for CCNP Service Provider and building a BGP lab on eve.ng"

bio: >-
  Network engineer who learned more in my home lab than I did in most classrooms.
  I lead healthcare network migrations (75+ switches, zero downtime), specializing
  in Cisco infrastructure and Python automation. My lab is where I test everything
  before production—new protocols, automation scripts, weird edge cases. If I can't
  break it at home, I'm confident deploying it at scale. CCNA and Network+ certified,
  DePaul Network Engineering grad, always building something.

