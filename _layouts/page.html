---
layout: default
---

<div class="page-banner">
    <div class="container">
        <a href="/" class="page-back-link">
            &larr; Back to Portfolio
        </a>
        <h1 class="page-banner-title">{{ page.title }}</h1>
    </div>
</div>

<div class="container page">
    {% if page.abstract %}
    <div class="abstract">
        <span class="abstract-label">Abstract</span>
        <p>{{ page.abstract }}</p>
    </div>
    {% endif %}
    {{ content }}
</div>
