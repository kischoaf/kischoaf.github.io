intro: >-
  My lab is where I test new protocols, automation scripts, and weird edge cases
  before they go anywhere near production.

# `project` links an item to its case study in projects/
gear:
  - name: Ubiquiti Dream Machine Pro
    role: Core router & firewall
    desc: >-
      Routing, firewall policy, IDS/IPS, and VLAN segmentation for the IoT, lab,
      and management networks.
    status: production

  - name: Raspberry Pi 4
    role: DNS & split-horizon resolver
    desc: >-
      AdGuard Home filtering for every device on the network, plus internal
      .lan hostnames for self-hosted services.
    status: production
    project: project-3

  - name: Unraid NAS
    role: Storage & container host
    desc: >-
      8TB array running Immich, PostgreSQL, and Redis in Docker, reachable
      remotely through Cloudflare Tunnel with no open inbound ports.
    status: production
    project: project-1

  - name: EVE-NG
    role: Network simulation lab
    desc: >-
      iBGP and eBGP sessions between simulated service provider routers for
      CCNP Service Provider study.
    status: active-study

topology: |2
                 ┌──────────────┐
                 │ ISP upstream │
                 └───────┬──────┘
                         │
       ┌─────────────────┴─────────────────┐
       │  Dream Machine Pro                │
       │  Router / firewall                │
       │  VLANs: IoT · Lab · Mgmt          │
       └─┬───────────────┬───────────────┬─┘
         │               │               │
  ┌──────┴─────┐  ┌──────┴─────┐  ┌──────┴─────┐
  │ Pi 4       │  │ Unraid NAS │  │ EVE-NG     │
  │ AdGuard    │  │ Docker     │  │ BGP lab    │
  │ DNS        │  │ Immich     │  │            │
  └────────────┘  └────────────┘  └────────────┘
