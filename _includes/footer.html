<footer id="contact" class="site-footer">
    <div class="container">
        <div class="site-footer__cta">
            <div>
                <h2 class="site-footer__title">Let's talk</h2>
                <p class="site-footer__text">Want to talk networks, automation, or something you saw here? Email is the fastest way to reach me.</p>
            </div>
            <div class="site-footer__actions">
                <a class="btn btn--primary" href="mailto:{{ site.email }}">{{ site.email }}</a>
                {% if site.linkedin_username and site.linkedin_username != "" %}
                <a class="btn btn--on-dark" href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">LinkedIn</a>
                {% endif %}
            </div>
        </div>

        <div class="site-footer__bottom">
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
            <ul class="site-footer__links">
                <li><a href="{{ '/assets/docs/Resume.pdf' | relative_url }}" target="_blank" rel="noopener">Resume</a></li>
                <li><a href="{{ '/notes/' | relative_url }}">Field Notes</a></li>
            </ul>
        </div>
    </div>
</footer>
