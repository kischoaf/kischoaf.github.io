<a class="skip-link" href="#main">Skip to content</a>

<header class="site-nav" id="site-nav">
    <nav class="container site-nav__inner" aria-label="Primary">
        <a href="{{ '/' | relative_url }}" class="site-nav__brand">{{ site.title }}</a>
        <button class="site-nav__toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">Menu</button>
        <div class="site-nav__menu" id="nav-menu">
            <ul class="site-nav__links">
                {% for link in site.nav_links %}
                {%- assign link_parts = link.url | split: '#' %}
                <li><a href="{{ link.url | relative_url }}"{% if link_parts.size > 1 %} data-section="{{ link_parts.last }}"{% elsif page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
                {% endfor %}
            </ul>
            <a href="{{ '/assets/docs/Resume.pdf' | relative_url }}" class="btn btn--primary btn--sm" target="_blank" rel="noopener">Resume</a>
        </div>
    </nav>
</header>

<script>
(function() {
    var nav    = document.getElementById('site-nav');
    var toggle = document.getElementById('nav-toggle');
    var menu   = document.getElementById('nav-menu');

    // ── Mobile menu ──────────────────────────────────────────────────────────
    function setMenu(open) {
        menu.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open);
        toggle.textContent = open ? 'Close' : 'Menu';
    }

    toggle.addEventListener('click', function() {
        setMenu(!menu.classList.contains('is-open'));
    });

    // Close once a destination is picked, or on Escape
    menu.addEventListener('click', function(e) {
        if (e.target.closest('a')) setMenu(false);
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') setMenu(false);
    });

    // ── Border once the page scrolls ─────────────────────────────────────────
    function onScroll() {
        nav.classList.toggle('is-scrolled', window.scrollY > 8);
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });

    // ── Highlight the link for the section in view (homepage only) ───────────
    var links = document.querySelectorAll('.site-nav__links a[data-section]');
    if (!links.length || !('IntersectionObserver' in window)) return;

    var linkFor = {};
    var sections = [];
    links.forEach(function(a) {
        var section = document.getElementById(a.dataset.section);
        if (!section) return;
        linkFor[section.id] = a;
        sections.push(section);
    });
    // The hero has no nav link; observing it clears the highlight at the top
    var hero = document.getElementById('top');
    if (hero) sections.push(hero);

    var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (!entry.isIntersecting) return;
            links.forEach(function(a) { a.removeAttribute('aria-current'); });
            if (linkFor[entry.target.id]) linkFor[entry.target.id].setAttribute('aria-current', 'true');
        });
    }, { rootMargin: '-40% 0px -55% 0px' });

    sections.forEach(function(section) { observer.observe(section); });
})();
</script>
