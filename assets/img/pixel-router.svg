<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" shape-rendering="crispEdges">

  <!-- Router Body -->
  <rect x="20" y="50" width="120" height="40" fill="#2b2b2b"/>
  <rect x="24" y="54" width="112" height="32" fill="#3a3a3a"/>

  <!-- Feet -->
  <rect x="30" y="90" width="12" height="6" fill="#1a1a1a"/>
  <rect x="118" y="90" width="12" height="6" fill="#1a1a1a"/>

  <!-- Antennas -->
  <rect x="40" y="20" width="6" height="30" fill="#2b2b2b"/>
  <rect x="114" y="20" width="6" height="30" fill="#2b2b2b"/>

  <!-- WiFi Signal Left -->
  <rect x="30" y="24" width="4" height="4" fill="#00ff88"/>
  <rect x="26" y="28" width="4" height="4" fill="#00ff88"/>
  <rect x="22" y="32" width="4" height="4" fill="#00ff88"/>

  <!-- WiFi Signal Right -->
  <rect x="126" y="24" width="4" height="4" fill="#00ff88"/>
  <rect x="130" y="28" width="4" height="4" fill="#00ff88"/>
  <rect x="134" y="32" width="4" height="4" fill="#00ff88"/>

  <!-- Status LEDs -->
  <rect x="40" y="68" width="6" height="6" fill="#00ff00"/>
  <rect x="52" y="68" width="6" height="6" fill="#00ff00"/>
  <rect x="64" y="68" width="6" height="6" fill="#00ff00"/>

  <!-- Ethernet Ports -->
  <rect x="88" y="64" width="10" height="12" fill="#111"/>
  <rect x="102" y="64" width="10" height="12" fill="#111"/>
  <rect x="116" y="64" width="10" height="12" fill="#111"/>

</svg>
